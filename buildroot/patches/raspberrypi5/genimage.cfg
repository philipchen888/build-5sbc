image efi-part.vfat {
        vfat {
                extraargs = "-i 30F29311"
                file EFI { image = "efi-part/EFI" }
                file Image { image = "Image" }
                file bcm2712-rpi-5-b.dtb { image = "bcm2712-rpi-5-b.dtb" }
                file rootfs.cpio.gz { image = "rootfs.cpio.gz" }
        }
        size = 512M
}

image sdcard.img {
	hdimage {
                partition-table-type = "gpt"
	}

        partition boot {
                partition-type-uuid = U
                bootable = "true"
                image = "efi-part.vfat"
                offset = 32K
        }

	partition rootfs {
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
                partition-uuid = 3209e62f-d124-43b9-b366-7c29a736cb49
		image = "rootfs.ext4"
	}
}
