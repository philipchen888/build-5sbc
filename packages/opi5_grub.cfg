set timeout=5
set default="Boot UUID"
set menu_color_normal=white/black
set menu_color_highlight=white/green

menuentry "Boot UUID" {
    search --no-floppy --fs-uuid --set=root b921b045-1df0-41c3-af44-4c6f280d3fae
    echo    'Loading Linux 6.18.0 ...'
    linux /boot/vmlinuz-6.18.0 root=LABEL=rootfs rw rootdelay=10
    echo    'Loading initial ramdisk ...'
    initrd /boot/initrd.img-6.18.0
    devicetree /boot/dtb/rockchip/rk3588-orangepi-5-plus.dtb
}
