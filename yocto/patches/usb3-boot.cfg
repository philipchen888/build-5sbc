# Core USB 3.0 Host & Storage
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PLATFORM=y
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_OF_SIMPLE=y
CONFIG_USB_STORAGE=y
CONFIG_USB_UAS=y

# Common Rockchip USB 2.0 PHY
CONFIG_PHY_ROCKCHIP_INNO_USB2=y

# RK3588 (Orange Pi 5 Plus) USB 3.0 PHY
CONFIG_TYPEC=y
CONFIG_PHY_ROCKCHIP_USBDP=y

# RK3399 (ROCK Pi 4B) USB 3.0 PHY
CONFIG_PHY_ROCKCHIP_TYPEC=y

# RK3328 (ROC-RK3328-CC) USB 3.0 PHY
CONFIG_PHY_ROCKCHIP_INNO_USB3=y
