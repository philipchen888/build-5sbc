set timeout=5
set default="Boot UUID"
set menu_color_normal=white/black
set menu_color_highlight=white/green

menuentry "Boot UUID" {
    search --no-floppy --fs-uuid --set=root 175b850b-d4f3-4214-8c7d-5d34e2b7d4d1
    echo    'Loading Linux 6.18.0 ...'
    linux /boot/vmlinuz-6.18.0 root=LABEL="root-arm64" rw rootdelay=10 video=HDMI-A-1:1920x1080@60 console=serial0,115200 console=tty1 systemd.firstboot=off
    echo    'Loading initial ramdisk ...'
    initrd /boot/initrd.img-6.18.0
    devicetree /boot/dtb/broadcom/bcm2711-rpi-4-b.dtb
}
